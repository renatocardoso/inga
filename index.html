<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="INGA - Inovação e Gestão Ambiental. Consultoria especializada em sustentabilidade, preservação da biodiversidade e estratégias participativas para conservação da natureza.">
    <meta name="keywords" content="sustentabilidade, biodiversidade, conservação da natureza, gestão ambiental, consultoria, estratégias participativas, INGA">
    <meta name="author" content="INGA">
    
    <title>INGA - Inovação e Gestão Ambiental</title>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Inter Font (variable font covering weights 100-900 + italics) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=1.3">
</head>
<body>
    <!-- Responsive Background Image Container -->
    <div id="bg-container" class="bg-container"></div>
    
    <!-- Main Content Layout -->
    <main id="main-layout" class="layout-grid">
        <!-- Brand Section (Left in Desktop / Top in Mobile) -->
        <section id="brand-section" class="brand-container">
            <div class="logo-wrapper">
                <img src="img/logoBranca.svg" alt="Logo INGA" id="brand-logo" class="logo-img">
            </div>
            <p id="brand-tagline" class="tagline inter-semibold">INOVAÇÃO E GESTÃO AMBIENTAL</p>
        </section>
        
        <!-- Phrase Section (Right in Desktop / Bottom in Mobile) -->
        <section id="phrase-section" class="content-container">
            <h1 id="main-phrase" class="main-phrase inter-medium">
                Estratégias<br>
                participativas<br>
                para a conservação<br>
                da natureza.
            </h1>
        </section>
    </main>

    <!-- Custom Script -->
    <script src="script.js?v=1.3"></script>
</body>
</html>
